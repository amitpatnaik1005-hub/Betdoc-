# ==============================================================================

# BetDoc — perimeter reverse proxy

#

# Two distinct traffic classes with opposite requirements:

#   /api/  request/response, must be rate limited, latency-sensitive

#   /ws    long-lived WebSocket odds feeds, must NOT be request-rate limited

# Treating them identically is the mistake that takes the feed down during a

# reconnect storm, so they get separate limiters.

# ==============================================================================



user  nginx;

worker_processes  auto;



# Must be >= the container ulimit or Nginx silently caps itself well below the

# configured worker_connections and starts dropping accepts under load.

worker_rlimit_nofile  65536;



pid        /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;



events {

    # epoll is the only sane event method on Linux; select/poll degrade

    # O(n) with connection count and this proxy holds tens of thousands of

    # idle-but-open WebSocket sockets.

    use                 epoll;

    worker_connections  16384;

    multi_accept        on;

}



http {

    include       /etc/nginx/mime.types;

    default_type  application/octet-stream;



    # --------------------------------------------------------------------------

    # Logging

    # --------------------------------------------------------------------------

    log_format  betdoc  '$remote_addr - $remote_user [$time_local] '

                        '"$request" $status $body_bytes_sent '

                        '"$http_referer" "$http_user_agent" '

                        'rt=$request_time uct="$upstream_connect_time" '

                        'uht="$upstream_header_time" urt="$upstream_response_time"';



    access_log  /var/log/nginx/access.log betdoc buffer=32k flush=5s;



    # --------------------------------------------------------------------------

    # Connection handling

    # --------------------------------------------------------------------------

    sendfile        on;

    tcp_nopush      on;



    # tcp_nodelay disables Nagle's algorithm. Mandatory here: Nagle buffers

    # small writes for up to 40ms waiting for an ACK, which on a price-tick

    # payload is an eternity and is invisible in application metrics.

    tcp_nodelay     on;



    keepalive_timeout   65;

    keepalive_requests  1000;

    reset_timedout_connection on;



    server_tokens       off;

    types_hash_max_size 4096;

    client_max_body_size 2m;

    client_body_timeout  15s;

    client_header_timeout 15s;

    large_client_header_buffers 4 16k;



    # --------------------------------------------------------------------------

    # Rate limiting zones

    #

    # 10m of shared memory holds roughly 160k distinct /32 keys, which is

    # sized for a public endpoint under a botnet, not just organic traffic.

    # --------------------------------------------------------------------------

    limit_req_zone   $binary_remote_addr  zone=api_limit:10m   rate=20r/s;

    limit_req_zone   $binary_remote_addr  zone=auth_limit:10m  rate=2r/s;



    # WebSockets are limited by *concurrent connections*, not request rate. A

    # WS upgrade is a single request, so limit_req would only ever punish

    # reconnects — precisely the moment a client must be allowed back in.

    limit_conn_zone  $binary_remote_addr  zone=ws_conn:10m;



    limit_req_status  429;

    limit_conn_status 429;

    limit_req_log_level warn;



    # --------------------------------------------------------------------------

    # WebSocket upgrade mapping

    #

    # Hardcoding `Connection: Upgrade` breaks plain HTTP keepalive to the

    # upstream. This map emits "upgrade" only when the client actually asked

    # for one, and "close" otherwise.

    # --------------------------------------------------------------------------

    map $http_upgrade $connection_upgrade {

        default  upgrade;

        ''       close;

    }



    # --------------------------------------------------------------------------

    # Upstreams

    # --------------------------------------------------------------------------

    upstream betdoc_api {

        server betdoc-api:8000 max_fails=3 fail_timeout=10s;



        # Persistent upstream connections eliminate a TCP+TLS handshake per

        # request on the hot path.

        keepalive             64;

        keepalive_requests    1000;

        keepalive_timeout     60s;

    }



    # Compression is deliberately off. On sub-kilobyte JSON tick payloads gzip

    # costs more in CPU and buffering latency than it saves in bytes, and

    # compressing a stream that also carries a session token invites BREACH.

    gzip off;



    # --------------------------------------------------------------------------

    # Port 80 — redirect only. No application traffic is served in the clear.

    # --------------------------------------------------------------------------

    server {

        listen      80 default_server;

        listen      [::]:80 default_server;

        server_name _;



        # ACME challenges must survive the redirect for certificate renewal.

        location /.well-known/acme-challenge/ {

            root /var/www/certbot;

        }



        location / {

            return 301 https://$host$request_uri;

        }

    }



    # --------------------------------------------------------------------------

    # Port 443 — TLS 1.3 only

    # --------------------------------------------------------------------------

    server {

        listen      443 ssl default_server;

        listen      [::]:443 ssl default_server;

        http2       on;

        server_name _;



        ssl_certificate           /etc/ssl/certs/betdoc.crt;

        ssl_certificate_key       /etc/ssl/private/betdoc.key;



        # TLS 1.3 exclusively. Every 1.3 cipher suite is AEAD and forward

        # secret, which is why server cipher preference is switched off: there

        # is no weak suite left for a client to be steered away from, and

        # letting the client pick lets it choose whichever it has hardware

        # acceleration for.

        ssl_protocols             TLSv1.3;

        ssl_prefer_server_ciphers off;



        ssl_session_cache         shared:SSL:10m;

        ssl_session_timeout       1d;

        ssl_session_tickets       off;



        ssl_stapling              on;

        ssl_stapling_verify       on;

        ssl_trusted_certificate   /etc/ssl/certs/betdoc-chain.crt;

        resolver                  127.0.0.11 valid=30s ipv6=off;

        resolver_timeout          5s;



        # ----------------------------------------------------------------------

        # Security headers

        #

        # IMPORTANT: nginx's add_header does not merge across levels. Any

        # location that declares its own add_header discards every inherited

        # one. They are therefore repeated in each location below rather than

        # set once here — verify with `curl -I` after any edit.

        # ----------------------------------------------------------------------

        add_header X-Frame-Options            "DENY" always;

        add_header X-Content-Type-Options     "nosniff" always;

        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

        add_header X-XSS-Protection           "0" always;

        add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'" always;



        # ----------------------------------------------------------------------

        # REST API

        # ----------------------------------------------------------------------

        location /api/ {

            limit_req  zone=api_limit burst=40 nodelay;

            limit_conn ws_conn 100;



            add_header X-Frame-Options            "DENY" always;

            add_header X-Content-Type-Options     "nosniff" always;

            add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

            add_header Referrer-Policy            "strict-origin-when-cross-origin" always;



            proxy_pass          http://betdoc_api;

            proxy_http_version  1.1;

            proxy_set_header    Connection        "";

            proxy_set_header    Host              $host;

            proxy_set_header    X-Real-IP         $remote_addr;

            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_set_header    X-Request-ID      $request_id;



            proxy_connect_timeout 3s;

            proxy_send_timeout    30s;

            proxy_read_timeout    30s;



            # Buffering off keeps first-byte latency deterministic instead of

            # waiting on nginx to fill a buffer before forwarding.

            proxy_buffering       off;

            proxy_request_buffering off;



            # Never silently replay a non-idempotent order placement against a

            # second upstream. A timed-out POST must surface as an error the

            # caller reconciles, not a possible duplicate bet.

            proxy_next_upstream   error timeout http_502 http_503;

            proxy_next_upstream_tries 2;

        }



        # ----------------------------------------------------------------------

        # Authentication — tighter limiter to blunt credential stuffing.

        # ----------------------------------------------------------------------

        location /api/v1/auth/ {

            limit_req zone=auth_limit burst=5 nodelay;



            add_header X-Frame-Options            "DENY" always;

            add_header X-Content-Type-Options     "nosniff" always;

            add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;



            proxy_pass          http://betdoc_api;

            proxy_http_version  1.1;

            proxy_set_header    Connection        "";

            proxy_set_header    Host              $host;

            proxy_set_header    X-Real-IP         $remote_addr;

            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_buffering     off;

        }



        # ----------------------------------------------------------------------

        # Live odds WebSocket feed

        # ----------------------------------------------------------------------

        location /ws {

            limit_conn ws_conn 10;



            add_header X-Frame-Options            "DENY" always;

            add_header X-Content-Type-Options     "nosniff" always;

            add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;



            proxy_pass          http://betdoc_api;



            # HTTP/1.1 plus the Upgrade/Connection pair is what makes the

            # 101 Switching Protocols handshake survive the proxy hop.

            proxy_http_version  1.1;

            proxy_set_header    Upgrade    $http_upgrade;

            proxy_set_header    Connection "Upgrade";



            proxy_set_header    Host              $host;

            proxy_set_header    X-Real-IP         $remote_addr;

            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_set_header    X-Forwarded-Proto $scheme;



            # A quiet market can leave a socket idle for a long time. The

            # default 60s read timeout would tear down every subscriber

            # between price moves; 3600s plus application-level pings keeps

            # them attached.

            proxy_read_timeout  3600s;

            proxy_send_timeout  3600s;

            proxy_connect_timeout 5s;



            # Buffering must be off for a stream: with it on, nginx withholds

            # ticks until a buffer fills, which is indistinguishable from a

            # stalled feed.

            proxy_buffering     off;

            proxy_cache         off;

            tcp_nodelay         on;

        }



        # ----------------------------------------------------------------------

        # Health probe — unlimited, unlogged, internal networks only.

        # ----------------------------------------------------------------------

        location = /health {

            access_log off;

            allow 172.28.0.0/16;

            allow 127.0.0.1;

            deny  all;



            proxy_pass         http://betdoc_api;

            proxy_http_version 1.1;

            proxy_set_header   Connection "";

            proxy_set_header   Host $host;

        }



        # Default deny. An explicit 404 on everything unrouted prevents a new

        # unguarded application route from being exposed by accident.

        location / {

            return 404;

        }

    }

}
