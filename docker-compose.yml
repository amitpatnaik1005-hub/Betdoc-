version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: betdoc_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: betdoc
    ports:
      - "5432:5432"
    volumes:
      - betdoc_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  betdoc_postgres_data:
