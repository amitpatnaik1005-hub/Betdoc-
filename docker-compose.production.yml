name: betdoc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [betdoc_net]
  logging: *default-logging

x-healthcheck-timing: &healthcheck-timing
  interval: ${HEALTHCHECK_INTERVAL:-30s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-3}
  start_period: ${HEALTHCHECK_START_PERIOD:-40s}

# One image for every Python process (API, Celery worker, beat, Omni dispatcher). Each service
# overrides the image's default command (migrations + gunicorn) with its own.
x-backend: &backend
  <<: *service-defaults
  image: betdoc-backend:${BETDOC_IMAGE_TAG:-latest}
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis_cache:6379/0
  ENVIRONMENT: production

services:
  postgres_db:
    <<: *service-defaults
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-timing
      # Law 10: Secure DB Healthcheck (pass credentials properly)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  redis_cache:
    <<: *service-defaults
    image: redis:7-alpine
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck-timing
      # FIX: redis-cli ping always returns 0 even on NOAUTH, so grep for PONG
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]

  backend_api:
    <<: *backend
    environment:
      <<: *backend-env
      # Trust Nginx proxy IP
      FORWARDED_ALLOW_IPS: "*"
      MAX_WORKERS: 4
      # Ingestion runs on celery_worker; API workers only serve requests (and relay live odds)
      OMNI_FLEET_INPROCESS_FALLBACK: "false"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      # Using our deep health endpoint
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ || exit 1"]

  # Executes the ingestion fleet, the quorum sweep and DB-configured provider polls.
  # Scale horizontally (docker compose up --scale celery_worker=N): per-source Redis locks keep
  # each data source to one run at a time across every replica.
  celery_worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.core.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_CONCURRENCY:-4}
      - --hostname=omni@%h
    environment: *backend-env
    depends_on:
      # The API container applies migrations on start; workers need the schema in place
      backend_api:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping -d omni@$$HOSTNAME --timeout 10 | grep -q pong"]

  # The scheduler: fleet tick every 5s, quorum sweep every 15s. Run exactly ONE replica;
  # two beats would double-enqueue (harmless thanks to the locks, but wasteful).
  celery_beat:
    <<: *backend
    command:
      - celery
      - -A
      - app.core.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    deploy:
      replicas: 1
    depends_on:
      redis_cache:
        condition: service_healthy
      celery_worker:
        condition: service_started

  # Rate-aware dispatcher for providers registered through /api/v1/admin/omni (idles when none are).
  omni_dispatcher:
    <<: *backend
    command: ["python", "-m", "app.workers.omni_dispatcher"]
    environment: *backend-env
    depends_on:
      backend_api:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  frontend_web:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend_api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]

networks:
  betdoc_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
