[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "betdoc"
version = "0.1.0"
description = "Real-time sports betting quantitative pricing, signal and risk platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "redis>=5.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
#  Typing — strict by policy. An untyped function in the quant engine is a bug.
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cvxpy.*", "scipy.*", "statsmodels.*", "playwright.*", "apscheduler.*", "aiosqlite.*", "asyncpg.*"]
ignore_missing_imports = true

# =============================================================================
#  Lint / format
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "C4",          # comprehensions
    "UP",          # pyupgrade
    "ASYNC",       # async correctness — blocking calls in the hot path
    "S",           # bandit security rules
    "RUF",
    "ANN",         # missing annotations
    "PL",          # pylint subset
    "NPY",         # numpy legacy API
]
ignore = [
    "ANN401",      # Any is occasionally correct at boundaries
    "PLR0913",     # quant functions legitimately take many parameters
    "PLR2004",     # magic values are readable in math code
    "S101",        # assert is allowed (used as invariant guards)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR"]

[tool.ruff.format]
quote-style = "double"

# =============================================================================
#  Tests
# =============================================================================
[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config --cov=src/betdoc --cov-report=term-missing --cov-fail-under=30"
markers = [
    "integration: requires a live Redis/PostgreSQL instance",
    "network: performs outbound network calls",
    "slow: numerical convergence tests",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/betdoc"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
